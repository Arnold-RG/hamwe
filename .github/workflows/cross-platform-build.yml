name: Cross-platform frontend compilation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/cross-platform-build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: TypeScript and Vite · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Compile browser frontend
        run: npx vite build

# This verifies compilation on three development OSes. It does not certify
# Safari on a physical iPhone or Chrome on a physical Android phone.
# Full production publishing and content checks remain in pages.yml.
